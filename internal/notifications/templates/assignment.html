{{define "assignment.html" -}}
<h1 style="margin:0 0 16px;color:#18181b;font-size:22px;font-weight:700;letter-spacing:-0.02em;">Review requested</h1>
<p style="margin:0 0 16px;color:#3f3f46;font-size:15px;line-height:1.6;">
  {{if .Assignee}}Hi <strong>{{.Assignee}}</strong>, you've{{else}}You've{{end}} been requested to review the following pull request.
</p>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px;background-color:#fafafa;border:1px solid #ededf0;border-radius:10px;">
  <tr>
    <td style="padding:18px 20px;">
      <p style="margin:0 0 4px;color:#a1a1aa;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;">Pull request</p>
      <p style="margin:0;color:#18181b;font-size:16px;font-weight:600;line-height:1.4;">{{.PRTitle}}</p>
      {{if .Summary}}<p style="margin:12px 0 0;color:#52525b;font-size:14px;line-height:1.6;">{{.Summary}}</p>{{end}}
    </td>
  </tr>
</table>

{{if .PRURL}}
<table role="presentation" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td style="border-radius:8px;background-color:#18181b;">
      <a href="{{.PRURL}}" style="display:inline-block;padding:12px 28px;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;border-radius:8px;">View pull request &rarr;</a>
    </td>
  </tr>
</table>
{{end}}
{{- end}}
