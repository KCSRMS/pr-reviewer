{{define "review_complete.html" -}}
<h1 style="margin:0 0 16px;color:#18181b;font-size:22px;font-weight:700;letter-spacing:-0.02em;">Review complete</h1>
<p style="margin:0 0 24px;color:#3f3f46;font-size:15px;line-height:1.6;">
  {{if .IsReReview}}A re-review has finished{{else}}A review has finished{{end}} for your pull request.
</p>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px;background-color:#fafafa;border:1px solid #ededf0;border-radius:10px;">
  <tr>
    <td style="padding:20px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td style="vertical-align:top;">
            <p style="margin:0 0 4px;color:#a1a1aa;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;">Pull request</p>
            <p style="margin:0;color:#18181b;font-size:16px;font-weight:600;line-height:1.4;">{{.PRTitle}}</p>
          </td>
          <td style="vertical-align:top;text-align:right;white-space:nowrap;padding-left:16px;">
            <span style="display:inline-block;padding:6px 14px;border-radius:999px;font-size:15px;font-weight:700;{{.ScoreStyle}}">{{.Score}}/100</span>
          </td>
        </tr>
      </table>
      {{if .Summary}}<p style="margin:16px 0 0;padding:14px 16px;background-color:#ffffff;border-left:3px solid #d4d4d8;border-radius:4px;color:#52525b;font-size:14px;line-height:1.6;">{{.Summary}}</p>{{end}}
    </td>
  </tr>
</table>

{{if .PRURL}}
<table role="presentation" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td style="border-radius:8px;background-color:#18181b;">
      <a href="{{.PRURL}}" style="display:inline-block;padding:12px 28px;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;border-radius:8px;">View full review &rarr;</a>
    </td>
  </tr>
</table>
{{end}}
{{- end}}
